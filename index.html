<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
    <!-- Meta Pixel Code -->
    <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '1039040052894510');
    fbq('track', 'PageView');
    
    // Disparar el evento con un pequeño retraso para asegurar que las extensiones lo capturen
    setTimeout(function() {
      if (window.fbq) {
        fbq('track', 'Schedule', { content_name: 'Agendamiento Confirmado' });
        console.log('[Meta Pixel] Evento Schedule enviado con éxito.');
      }
    }, 2000);
    </script>
    <!-- End Meta Pixel Code -->
  </head>
  <body>
    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=1039040052894510&ev=PageView&noscript=1"
    /></noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Disparo de respaldo al final del body con retraso mayor
      setTimeout(function() {
        if (window.fbq) {
          fbq('track', 'Schedule', { content_name: 'Agendamiento Final' });
          console.log('[Meta Pixel] Evento Schedule enviado desde el final del body.');
        }
      }, 4000);
    </script>
  </body>
</html>
